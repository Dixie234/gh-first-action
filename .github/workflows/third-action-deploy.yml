name: Env Var Deployment
on:
  push:
    branches:
      - master
      - dev
env: 
  MONGODB_DB_NAME: gha-demo
jobs:
  test:
    env: 
      MONGODB_CLUSTER_ADDRESS: mynewcluster.v1ns2t5.mongodb.net
      MONGODB_USERNAME: github-actions-user-1
      MONGODB_PASSWORD: YBGw!Y2ssH9ui&5
      PORT: 8080
    environment: testing
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/third-action/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci --prefix third-action
      - name: Run server
        run: npm start --prefix third-action & npx wait-on http://127.0.0.1:XYZ
      - name: Run tests
        run: npm test --prefix third-action
      - name: Output information
        run: |
          echo "MONGODB_USERNAME: ${{ env.MONGODB_USERNAME }}"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |        
          echo "MONGODB_USERNAME: ${{ env.MONGODB_DB_NAME }}"
