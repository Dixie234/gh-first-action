name: Composite Action Deploy
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Run Linting
        run: npm run lint --prefix second-action
      - name: Run tests
        run: npm run test --prefix second-action
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Build Project
        run: npm run build --prefix second-action
  information:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Run JS Action
        uses: ./.github/actions/deploy-s3-javascript
